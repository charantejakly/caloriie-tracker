<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEAN MODE - Muscle Heatmap Dashboard</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: 1px;
      margin-bottom: 5px;
      color: #f0f0f0;
    }

    p.subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .heatmap-wrapper {
      display: flex;
      gap: 40px;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .view-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .view-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .anatomy-svg {
      width: 200px;
      height: 400px;
    }

    .muscle-path {
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .muscle-path:hover {
      filter: brightness(1.15);
    }

    /* Heatmap Legend UI */
    .heatmap-legend {
      display: flex;
      gap: 20px;
      margin-top: 25px;
      align-items: center;
      background: #1e1e1e;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ccc;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <h1>LEAN MODE</h1>
  <p class="subtitle">Daily Muscle Recovery & Volume Heatmap</p>

  <div class="heatmap-wrapper">
    <!-- Anterior (Front) View -->
    <div class="view-container">
      <span class="view-label">ANTERIOR</span>
      <div id="front-view"></div>
    </div>
    
    <!-- Posterior (Back) View -->
    <div class="view-container">
      <span class="view-label">POSTERIOR</span>
      <div id="back-view"></div>
    </div>
  </div>

  <!-- Legend -->
  <div class="heatmap-legend">
    <span style="color: #777; font-weight: bold;">INTENSITY:</span>
    <div class="legend-item"><span class="legend-color" style="background: #A7A9A5;"></span> Untrained</div>
    <div class="legend-item"><span class="legend-color" style="background: #D1E7DD;"></span> Light</div>
    <div class="legend-item"><span class="legend-color" style="background: #A3CFBB;"></span> Moderate</div>
    <div class="legend-item"><span class="legend-color" style="background: #FFD166;"></span> Intense</div>
    <div class="legend-item"><span class="legend-color" style="background: #EF476F;"></span> Peak</div>
  </div>

  <script type="module">
    import { LEAN_MODE_ANATOMY } from './anatomy-svg.js';
    import { MuscleHeatmapController } from './anatomy-controller.js';

    // 1. Initialize controller
    const heatmap = new MuscleHeatmapController('front-view', 'back-view');
    
    // 2. Render SVG models into the DOM
    heatmap.render(LEAN_MODE_ANATOMY);

    // 3. Setup click interaction
    heatmap.initInteractivity((muscleId, currentTier) => {
      alert(`Clicked Muscle ID: ${muscleId}\nCurrent Intensity Tier: ${currentTier}`);
    });

    // 4. Test Simulation: Apply workout data after 1 second
    setTimeout(() => {
      heatmap.applyWorkoutData({
        'chest-pectoralis-major-left': 4,
        'chest-pectoralis-major-right': 4,
        'anterior-deltoids-left': 3,
        'anterior-deltoids-right': 3,
        'quadriceps-left': 2,
        'quadriceps-right': 2
      });
    }, 1000);
  </script>

</body>
</html>
